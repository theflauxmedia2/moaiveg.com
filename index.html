    <!-- Blank-screen guard: if a build bundle fails to load (e.g. a cached index.html after a redeploy), reload once with fresh files -->
    <script>
      (function () {
        var KEY = "moai-asset-reload";
        window.addEventListener(
          "error",
          function (e) {
            var el = e.target;
            var src = el && (el.src || el.href);
            if (!src || src.indexOf("/assets/") === -1) return;
            try {
              if (sessionStorage.getItem(KEY)) return;
              sessionStorage.setItem(KEY, "1");
            } catch (err) {
              return;
            }
            var url = new URL(location.href);
            url.searchParams.set("r", Date.now());
            location.replace(url.toString());
          },
          true
        );
        // Clear the flag only once the app has actually rendered, so a persistent failure can't loop.
        window.addEventListener("load", function () {
          setTimeout(function () {
            var root = document.getElementById("root");
            if (!root || !root.children.length) return;
            try {
              sessionStorage.removeItem(KEY);
            } catch (err) {}
          }, 3000);
        });
      })();
    </script>
